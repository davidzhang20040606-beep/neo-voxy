name: Build Neo Voxy 1.20.1 Forge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 1.20.1 Forge client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Build 1.20.1 Forge client
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build.sh client-1.20.1
          mapfile -t jars < <(find dist -maxdepth 1 -type f -name '*.jar' -print)
          if (( ${#jars[@]} != 1 )); then
            printf 'Expected one release JAR, found %d:\n' "${#jars[@]}" >&2
            printf '  %s\n' "${jars[@]}" >&2
            exit 1
          fi
          sha256sum "${jars[0]}"

      - name: Upload 1.20.1 Forge client
        uses: actions/upload-artifact@v7
        with:
          name: neo-voxy-1.20.1-forge-client
          path: dist/*.jar
          if-no-files-found: error
          compression-level: 0
